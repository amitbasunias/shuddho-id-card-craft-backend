name: shuddho-id-card-craft
region: sgp                        # Singapore — closest to Bangladesh

services:
  - name: api
    dockerfile_path: Dockerfile
    github:
      repo: amitbasunias/shuddho-id-card-craft-backend
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /admin/login/
    envs:
      - key: DJANGO_SECRET_KEY
        value: "change-me-to-a-real-secret"
        type: SECRET
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".ondigitalocean.app"
      - key: SAAS_DEFAULT_CURRENCY
        value: BDT
      - key: SAAS_SITE_NAME
        value: "ID Craft SaaS"
      - key: SAAS_DUE_SOON_DAYS
        value: "7"
